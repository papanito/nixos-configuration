---
# Flake update + Colmena deployment pipeline.
#
# Runs on the project-scoped shell runner on envy17 (tag: nixos-deploy).
# The shell executor shares envy17's /nix store, so builds are incremental
# and Colmena can build aarch64 closures for rpi4-a locally via binfmt.
#
# Required project CI/CD variables (protected):
#   CI_PUSH_TOKEN        project access token with api + write_repository
#   NIXOS_SSH_KEY_FILE   file variable with the ci-deploy private key
#   GOOGLE_CHAT_WEBHOOK  optional; Google Chat space webhook for MR notices
#                        (protected; GitLab cannot mask query-string URLs)
#
# The runner is created with access_level=not_protected so merge request
# pipelines can run validation. Fork pipelines must stay disabled on the
# project (Settings > CI/CD > Token Access / Pipelines for merge requests),
# otherwise a shell runner would execute untrusted code on envy17.
#
# Deploys are split into `deploy:x86` (envy, lenovo, envy17) and
# `deploy:rpi4` (rpi4-a) so the Pi can be skipped independently.
# On a manual web pipeline both jobs are manual.

stages:
  - validate
  - build
  - update
  - deploy

default:
  tags:
    - nixos-deploy
  interruptible: false

variables:
  GIT_DEPTH: "0"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    extra-platforms = aarch64-linux armv7l-linux

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.nix:
  before_script:
    - nix --version
    - colmena --version

# Evaluate every host's top-level derivation without building it. Catches
# option/type errors and broken input updates before anything is deployed.
validate:
  stage: validate
  extends: .nix
  interruptible: true
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      set -eu
      for host in envy envy17 lenovo rpi4-a; do
        echo "Evaluating ${host}"
        nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" >/dev/null
      done

# Build all host closures locally. x86 and rpi4-a are separate jobs so they
# run in parallel; each job builds its hosts serially (-p 1). The runner has
# two slots. Deploy jobs reuse these store paths.
# This runs on merge requests and pushes to main, not on manual web runs:
# the manual deploy jobs build only the hosts they actually deploy.
.build:
  stage: build
  extends: .nix
  timeout: 3h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build:x86:
  extends: .build
  script:
    - colmena build --impure --on envy,lenovo,envy17 -p 1

build:rpi4:
  extends: .build
  script:
    - colmena build --impure --on rpi4-a

# Schedule (Mon/Wed/Sat 03:00 Europe/Zurich, cron `0 3 * * */3`): update
# flake.lock, push chore/update-flake-lock, open or refresh its merge request,
# and announce that MR in Google Chat. Merging the MR is the only path that
# deploys: the merge push runs the normal `main` pipeline (validate + build +
# deploy). Nothing deploys from the schedule itself, so a broken flake update
# never reaches the hosts.
update-flake-lock:
  stage: update
  extends: .nix
  timeout: 1h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      set -eu
      git config user.name "GitLab CI"
      git config user.email "ci@papanito.wyssmann.com"

      # Keep the committed lockfile so the notification can name the inputs
      # whose locked revs actually moved.
      git show "HEAD:flake.lock" > "${TMPDIR:-/tmp}/flake.lock.before"

      nix flake update

      if git diff --quiet -- flake.lock; then
        echo "flake.lock is already up to date"
        exit 0
      fi

      changed=$(
        {
          jq -r '.nodes | to_entries[] | "\(.key) \(.value.locked.rev // .value.locked.lastModified // "-")"' \
            "${TMPDIR:-/tmp}/flake.lock.before"
          jq -r '.nodes | to_entries[] | "\(.key) \(.value.locked.rev // .value.locked.lastModified // "-")"' \
            flake.lock
        } | sort | uniq -u | awk '{print $1}' | sort -u \
          | awk 'BEGIN { sep = "" } { printf "%s%s", sep, $0; sep = ", " }'
      )
      [ -n "${changed}" ] || changed="(unable to detect changed inputs)"

      notify() {
        if [ -z "${GOOGLE_CHAT_WEBHOOK:-}" ]; then
          echo "GOOGLE_CHAT_WEBHOOK is not set; skipping Google Chat notification"
          return 0
        fi
        jq -n --arg text "$1" '{text: $text}' \
          | curl --silent --show-error --fail \
            --header 'Content-Type: application/json; charset=UTF-8' \
            --data @- "${GOOGLE_CHAT_WEBHOOK}" >/dev/null \
          || echo "WARNING: Google Chat notification failed"
      }

      git add flake.lock
      git commit -m "chore: Update flake lock"
      git push --force \
        "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "HEAD:refs/heads/chore/update-flake-lock"

      # Create the MR through the API instead of push options: GitLab can
      # create a duplicate MR when merge_request.create is pushed repeatedly
      # to the same branch. Reuse the open MR when it already exists.
      mr_api="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"

      existing=$(curl --silent --show-error --fail \
        --header "PRIVATE-TOKEN: ${CI_PUSH_TOKEN}" \
        "${mr_api}?source_branch=chore/update-flake-lock&state=opened" \
        | jq 'length')

      if [ "${existing}" -eq 0 ]; then
        mr_url=$(curl --silent --show-error --fail \
          --request POST \
          --header "PRIVATE-TOKEN: ${CI_PUSH_TOKEN}" \
          --data-urlencode "source_branch=chore/update-flake-lock" \
          --data-urlencode "target_branch=${CI_DEFAULT_BRANCH}" \
          --data-urlencode "title=chore: Update flake lock" \
          --data-urlencode "remove_source_branch=true" \
          --data-urlencode "description=Automated nix flake update from pipeline ${CI_PIPELINE_ID}. Merging deploys envy, lenovo, envy17 and rpi4-a." \
          "${mr_api}" | jq -r '.web_url')
        state="ready to merge"
        echo "Created merge request ${mr_url}"
      else
        mr_url=$(curl --silent --show-error --fail \
          --header "PRIVATE-TOKEN: ${CI_PUSH_TOKEN}" \
          "${mr_api}?source_branch=chore/update-flake-lock&state=opened" \
          | jq -r '.[0].web_url')
        state="updated, open again"
        echo "Existing merge request refreshed by push: ${mr_url}"
      fi

      message=$(printf '*Flake lock update %s*\nInputs changed: %s\nMR: %s\nMerging runs validate + build, then deploys envy, lenovo, envy17 and rpi4-a.\nPipeline: %s/-/pipelines/%s' \
        "${state}" "${changed}" "${mr_url}" "${CI_PROJECT_URL}" "${CI_PIPELINE_ID}")

      notify "${message}"

# Deploy after a merge/push to main. The runner host (envy17) goes last in
# the x86 job so its activation cannot take the runner down before the other
# x86 hosts are updated. stopIfChanged/restartIfChanged are disabled for
# gitlab-runner, so a nixpkgs bump does not kill the job mid-switch.
.deploy:
  stage: deploy
  extends: .nix
  resource_group: nixos-deploy
  timeout: 3h
  environment:
    name: homelab
  before_script:
    - nix --version
    - colmena --version
    - install -m 700 -d "$HOME/.ssh"
    - install -m 600 "$NIXOS_SSH_KEY_FILE" "$HOME/.ssh/id_ed25519"
  after_script:
    - rm -f "$HOME/.ssh/id_ed25519"

# Non-Raspberry-Pi hosts: envy, lenovo, and the runner host envy17 last.
# Automatic on main; manual on a web pipeline (run only this to skip rpi4-a).
deploy:x86:
  extends: .deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - |
      set -eu
      cleanup() { rm -f "$HOME/.ssh/id_ed25519"; }
      trap cleanup EXIT

      colmena apply --impure --on envy,lenovo -p 1
      colmena apply --impure --on envy17

# Raspberry Pi host. Separate job so it can be skipped independently.
# resource_group + runner concurrent=1 ensure it never overlaps deploy:x86.
deploy:rpi4:
  extends: .deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - |
      set -eu
      cleanup() { rm -f "$HOME/.ssh/id_ed25519"; }
      trap cleanup EXIT

      colmena apply --impure --on rpi4-a
